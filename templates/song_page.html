{%- extends "base.html" -%}
{%- block title -%}{{ song.title }} - BeatBox{% endblock %}

{%- block content -%}

    <audio controls>
  <source src="{{ url_for('static', filename='audios/song1.mp3') }}" type="audio/mpeg">
Your browser does not support the audio element.
</audio>
    <p><strong>Genre:</strong> {{ song.genre }}</p>
    <p><strong>Lyrics:</strong></p>
    <pre>{{ song.lyrics }}</pre>

{%- endblock -%}
