<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ username.title() }}'s Profile</title>
</head>
<body>

    <h1>{{ username.title() }}'s Profile</h1>

    <!-- Form to create a new playlist -->
    <h3>Create a New Playlist</h3>
    <form action="/user/{{ user_key }}/playlist/create" method="POST">
        <input type="text" name="playlist_name" placeholder="Playlist name" required>
        <button type="submit">Create Playlist</button>
    </form>

    <hr>

    <p>Select a playlist:</p>
    <ul>
        {% for playlist in playlists %}
            <li>
                <a href="/user/{{ user_key }}/playlist/{{ playlist.name }}">
                    {{ playlist.name.title() }}
                </a>
            </li>
        {% else %}
            <li>No playlists found for this user.</li>
        {% endfor %}
    </ul>

    <br>
    <a href="/">Back to Home</a>

</body>
</html>
