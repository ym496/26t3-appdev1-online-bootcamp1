{% extends "admin_nav.html" %}

{% block title %}Artists{% endblock %}

{% block content %}
<h1>Artists</h1>
<ul>
    {% for user in users %}
        <li>{{ user.username }}
            {% if user.is_blacklisted == False %}
                <form action="/blacklist_user/{{ user.id }}" method="post" style="display:inline;">
                    <input type="submit" value="❌ Blacklist">
                </form>
            {% else %}
                <form action="/unblacklist_user/{{ user.id }}" method="post" style="display:inline;">
                    <input type="submit" value="Unblacklist">
                </form>
            {% endif %}
        </li> 

    {% endfor %}
</ul>
{% endblock %}
